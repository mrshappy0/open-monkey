name: Release

on:
  push:
    branches: ['main']

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wxt prepare
      - name: Type-check
        run: pnpm compile
      - name: Lint
        run: pnpm lint
      - name: Release
        env:
          # GH_TOKEN must be a classic PAT (repo scope) from a repo admin.
          # GITHUB_TOKEN alone cannot push to protected main.
          # Create one at https://github.com/settings/tokens and add as GH_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
